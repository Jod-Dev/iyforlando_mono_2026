name: Verify Restrictions

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify-restrictions:
    name: Verify Project Restrictions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: iyf_backend_2026/package-lock.json
      
      - name: Install dependencies
        working-directory: ./iyf_backend_2026
        run: npm ci
      
      - name: Verify restrictions script
        run: |
          chmod +x scripts/verify-restrictions.js
          node scripts/verify-restrictions.js
      
      - name: Verify RLS
        run: |
          chmod +x scripts/verify-rls.js
          node scripts/verify-rls.js
        continue-on-error: true
      
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
      
      - name: Run ESLint
        working-directory: ./iyf_backend_2026
        run: npm run lint || true
        continue-on-error: true
      
      - name: Check TypeScript
        working-directory: ./iyf_backend_2026
        run: npx tsc --noEmit || true
        continue-on-error: true

  verify-security:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run security audit
        working-directory: ./iyf_backend_2026
        run: npm audit --audit-level=moderate || true
        continue-on-error: true
      
      - name: Check for vulnerable dependencies
        working-directory: ./iyf_backend_2026
        run: |
          npm audit --json > audit.json || true
          if [ -f audit.json ]; then
            VULNERABILITIES=$(cat audit.json | jq '.metadata.vulnerabilities.total // 0')
            if [ "$VULNERABILITIES" -gt 0 ]; then
              echo "⚠️ Found $VULNERABILITIES vulnerabilities"
              exit 1
            fi
          fi
        continue-on-error: true

